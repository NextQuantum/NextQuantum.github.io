<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#6366f1" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#ec4899" opacity="0.1"/>
  <circle cx="800" cy="150" r="150" fill="#06b6d4" opacity="0.05"/>
  
  <!-- Logo/Icon -->
  <g transform="translate(520, 150)">
    <!-- Pie base -->
    <ellipse cx="80" cy="100" rx="70" ry="25" fill="#d4a574"/>
    <ellipse cx="80" cy="90" rx="60" ry="20" fill="#8b5a2b"/>
    <ellipse cx="80" cy="75" rx="70" ry="25" fill="#e8c49a"/>
    
    <!-- Raspberry -->
    <g transform="translate(80, 55)">
      <circle cx="-12" cy="0" r="10" fill="url(#primaryGradient)"/>
      <circle cx="0" cy="-8" r="10" fill="url(#primaryGradient)"/>
      <circle cx="12" cy="0" r="10" fill="url(#primaryGradient)"/>
      <circle cx="0" cy="8" r="8" fill="url(#primaryGradient)"/>
      <circle cx="-8" cy="-12" r="7" fill="url(#primaryGradient)"/>
      <circle cx="8" cy="-12" r="7" fill="url(#primaryGradient)"/>
      <path d="M0,-20 Q15,-32 8,-40 Q0,-30 -8,-40 Q-15,-32 0,-20" fill="#22c55e"/>
    </g>
    
    <!-- Steam -->
    <g fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M50,45 Q40,25 50,5"/>
      <path d="M80,35 Q70,15 80,-5"/>
      <path d="M110,45 Q100,25 110,5"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="350" font-family="Inter, sans-serif" font-size="72" font-weight="800" text-anchor="middle" fill="#f8fafc">
    EasyPi
  </text>
  
  <!-- Tagline -->
  <text x="600" y="420" font-family="Inter, sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#94a3b8">
    Modern Raspberry Pi Management
  </text>
  
  <!-- Gradient underline -->
  <rect x="300" y="450" width="600" height="4" rx="2" fill="url(#primaryGradient)"/>
  
  <!-- Features badges -->
  <g font-family="Inter, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(300, 500)">
      <rect width="130" height="36" rx="18" fill="rgba(99, 102, 241, 0.2)"/>
      <text x="65" y="24" text-anchor="middle" fill="#818cf8">🖥️ Dashboard</text>
    </g>
    <g transform="translate(450, 500)">
      <rect width="130" height="36" rx="18" fill="rgba(99, 102, 241, 0.2)"/>
      <text x="65" y="24" text-anchor="middle" fill="#818cf8">🔐 Security</text>
    </g>
    <g transform="translate(600, 500)">
      <rect width="130" height="36" rx="18" fill="rgba(99, 102, 241, 0.2)"/>
      <text x="65" y="24" text-anchor="middle" fill="#818cf8">🚀 Services</text>
    </g>
    <g transform="translate(750, 500)">
      <rect width="130" height="36" rx="18" fill="rgba(99, 102, 241, 0.2)"/>
      <text x="65" y="24" text-anchor="middle" fill="#818cf8">🤖 AI Chat</text>
    </g>
  </g>
  
  <!-- Bottom branding -->
  <text x="600" y="590" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">
    github.com/NextQuantum/EasyPi
  </text>
</svg>
